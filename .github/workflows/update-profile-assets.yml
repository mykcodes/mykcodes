name: Update Profile Data & Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch GitHub data
        run: python scripts/fetch_github_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Dashboard
        run: python scripts/generate_github_dashboard.py

      - name: Generate Language Visualization
        run: python scripts/generate_languages.py

      - name: Generate Profile Assets
        run: python scripts/generate_assets.py

      - name: Validate
        run: python scripts/validate.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/generated/ assets/projects/
          git diff --quiet --cached || git commit -m "chore: update profile data & assets [skip ci]"
          git push
